[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true

[fmt]
line_length = 120
ignore = ["src/CatWarsEngine.sol", "test/CatWarsEngine.t.sol", "lib/**"]
